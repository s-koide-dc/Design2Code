name: asset-validation

on:
  workflow_dispatch:

jobs:
  validate-local-assets:
    runs-on: [self-hosted, nlp-assets]
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      LOCAL_ASSET_MANIFEST_PATH: ${{ vars.NLP_ASSET_MANIFEST_PATH }}
      LOCAL_ASSET_WORKSPACE_ROOT: ${{ vars.NLP_ASSET_WORKSPACE_ROOT }}
    steps:
      - name: Check runner manifest configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LOCAL_ASSET_MANIFEST_PATH) -or [string]::IsNullOrWhiteSpace($env:LOCAL_ASSET_WORKSPACE_ROOT)) {
            throw "Repository variables NLP_ASSET_MANIFEST_PATH and NLP_ASSET_WORKSPACE_ROOT must point to the runner's pinned asset environment."
          }

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.109"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate hash-pinned local assets
        shell: pwsh
        run: |
          python scripts/validate/validate_local_asset_manifest.py `
            --capability semantic_method_search `
            --capability dictionary_search `
            --manifest "$env:LOCAL_ASSET_MANIFEST_PATH" `
            --workspace-root "$env:LOCAL_ASSET_WORKSPACE_ROOT"

      - name: Connect pinned semantic assets to checkout
        shell: pwsh
        run: |
          $assetVectors = Join-Path $env:LOCAL_ASSET_WORKSPACE_ROOT "resources\vectors"
          $checkoutVectors = Join-Path $PWD "resources\vectors"
          if (-not (Test-Path -LiteralPath $assetVectors -PathType Container)) {
            throw "The pinned asset workspace does not contain resources\vectors."
          }
          if (Test-Path -LiteralPath $checkoutVectors) {
            throw "Checkout unexpectedly contains resources\vectors; refusing to replace it."
          }
          New-Item -ItemType Junction -Path $checkoutVectors -Target $assetVectors | Out-Null
          $assetDictionary = Join-Path $env:LOCAL_ASSET_WORKSPACE_ROOT "resources\dictionary.db"
          $checkoutDictionary = Join-Path $PWD "resources\dictionary.db"
          if (-not (Test-Path -LiteralPath $assetDictionary -PathType Leaf)) {
            throw "The pinned asset workspace does not contain resources\dictionary.db."
          }
          Copy-Item -LiteralPath $assetDictionary -Destination $checkoutDictionary

      - name: Run local semantic quality gate
        shell: pwsh
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP "local_semantic_quality_gate.json"
          python scripts/validate/run_local_semantic_quality_gate.py `
            --workspace-root "$env:LOCAL_ASSET_WORKSPACE_ROOT" `
            --manifest "$env:LOCAL_ASSET_MANIFEST_PATH" `
            --output $reportPath

      - name: Run asset-dependent integration regressions
        shell: pwsh
        run: |
          Remove-Item Env:SKIP_VECTOR_MODEL -ErrorAction SilentlyContinue
          python scripts/validate/validate_ci_test_matrix.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $matrix = Get-Content tests/ci_test_matrix.json -Raw | ConvertFrom-Json
          $failed = @()
          foreach ($entry in @($matrix.integration.ci_excluded)) {
            $module = "tests.integration.$([System.IO.Path]::GetFileNameWithoutExtension($entry.file))"
            python -m unittest $module -v
            if ($LASTEXITCODE -ne 0) {
              $failed += $module
            }
          }
          if ($failed.Count -gt 0) {
            throw "Asset-dependent integration failures: $($failed -join ', ')"
          }
