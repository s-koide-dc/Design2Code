name: python-ci

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      SKIP_VECTOR_MODEL: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.109"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        shell: pwsh
        run: |
          $output = & python scripts/validate/run_unit_by_file.py --verbosity 2 --failure-report unit_failures.txt 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            if (Test-Path unit_failures.txt) {
              $failed = Get-Content unit_failures.txt -Raw
              $failed = $failed.Replace("`r", "").Replace("`n", "%0A")
              Write-Host "::error file=scripts/validate/run_unit_by_file.py,title=Unit failures::$failed"
            } else {
              $tail = ($output | Select-Object -Last 80) -join "%0A"
              Write-Host "::error file=scripts/validate/run_unit_by_file.py,title=Unit failure output::Unit test runner failed before writing unit_failures.txt.%0A$tail"
            }
            exit $code
          }

  documented-entrypoints:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      SKIP_VECTOR_MODEL: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.109"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run documented entrypoints regression
        shell: pwsh
        run: |
          if (-not (Test-Path "resources/vectors/vector_db/method_store_meta.json")) {
            Write-Host "Skipping documented entrypoints regression in asset-free CI; run locally with generated method-store vector DB."
            exit 0
          }
          python -m unittest tests.integration.test_documented_entrypoints -v

  integration:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SUPPRESS_VECTOR_WARNINGS: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.109"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run integration tests
        shell: pwsh
        run: |
          $excluded = @(
            "test_documented_entrypoints.py",
            # Real model assets are intentionally unavailable on GitHub.
            # See docs/real_vector_model_validation.md for the local validation contract.
            "test_semantic_method_search.py",
            "test_vector_engine_real_model.py",
            # These suites rely on dictionary/vector/generated method-store assets
            # that are intentionally not stored in GitHub.
            "test_conversation_scenarios.py",
            "test_end_to_end_scenarios.py",
            "test_full_integrated_pipeline.py",
            "test_reverse_lookup_flow.py"
          )
          $failed = @()
          Get-ChildItem tests/integration -Filter "test_*.py" |
            Where-Object { $_.Name -notin $excluded } |
            Sort-Object Name |
            ForEach-Object {
              $module = "tests.integration.$($_.BaseName)"
              python -m unittest $module -v
              if ($LASTEXITCODE -ne 0) {
                $failed += $module
              }
            }
          if ($failed.Count -gt 0) {
            throw "Integration failures: $($failed -join ', ')"
          }

  generation-quality:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      SKIP_VECTOR_MODEL: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.109"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build CodeBuilder
        run: dotnet build tools/csharp/CodeBuilder/CodeBuilder.csproj --nologo

      - name: Run generated code quality regression
        run: python scripts/design/run_design_generation_regression.py --fail-on-maintainability

      - name: Run generated code runtime behavior regression
        run: python -m unittest tests.integration.test_runtime_execution -v

  security:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      SKIP_VECTOR_MODEL: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run security regression
        run: python -m unittest tests.security.test_security_vulnerabilities -v

  consistency:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      SKIP_VECTOR_MODEL: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.109"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run consistency validation
        run: python scripts/validate_project_consistency.py

      - name: Validate configuration files
        run: python -c "from src.config.config_manager import ConfigManager; ConfigManager(strict=True)"

      - name: Run unit smoke regression
        run: python scripts/validate/run_unit_smoke.py --profile core --profile parser --profile synthesis --verbosity 2

      - name: Compile representative generated code
        run: python -m unittest tests.integration.test_generated_lambda_compilation -v
